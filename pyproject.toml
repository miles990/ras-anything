[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ras-anything"
version = "0.1.0"
description = "Don't rewrite it for reliability. Harden the 5% that breaks."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "miles990"}]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
]

[project.scripts]
ras-anything = "ras_anything.cli:main"

[project.urls]
Homepage = "https://github.com/miles990/ras-anything"

[tool.setuptools]
packages = ["ras_anything", "ras_anything._inject"]

[tool.setuptools.package-data]
ras_anything = ["_inject/*.py"]
