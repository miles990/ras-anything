[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ras-anything"
version = "0.2.0"
description = "Don't rewrite it for reliability. Harden the 5% that breaks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "miles990"}]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
]

[project.scripts]
ras-anything = "ras_anything.cli:main"

[project.urls]
Homepage = "https://github.com/miles990/ras-anything"

[tool.setuptools]
packages = ["ras_anything", "ras_anything.lang", "ras_anything.patterns", "ras_anything.exporters", "ras_anything.agents", "ras_anything.agents.python", "ras_anything.agents.python._inject"]

[tool.setuptools.package-data]
"ras_anything" = ["py.typed"]
"ras_anything.agents.python" = ["_inject/*.py"]
"ras_anything.lang" = [
    # every language's in-app agent ships whole: a new lang/<name>_agent/ needs no edit here (docs/adr/0003)
    "*_agent/**/*.cjs", "*_agent/**/*.mjs", "*_agent/**/*.js",
    "*_agent/**/*.go", "*_agent/**/*.java", "*_agent/**/*.cs", "*_agent/**/*.php", "*_agent/**/*.rb", "*_agent/**/*.kt",
    "*_agent/**/*.c", "*_agent/**/*.h", "*_agent/**/*.cpp", "*_agent/**/*.R", "*_agent/**/*.json", "*_agent/**/*.mod", "*_agent/**/*.sum",
]

# Lint gate (CI + `make lint`): pyflakes errors are bugs here (an undefined name shipped in doctor.status).
# Style rules (line length, %-formatting) are not enforced: the code base predates them (docs/REVIEW-PRACTICES.md).
[tool.ruff]
target-version = "py310"
line-length = 140
extend-exclude = ["examples", "build", "wow", "ras_anything/lang/*_agent"]

[tool.ruff.lint]
select = ["F", "E9", "B006", "B008", "B012", "B015", "B018"]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/*" = ["F401"]
"tests/test_install.py" = ["F841"]

[tool.mypy]
python_version = "3.10"
files = ["ras_anything/contracts.py", "ras_anything/lang/base.py", "ras_anything/lang/__init__.py", "ras_anything/patterns/__init__.py", "ras_anything/hardens.py", "ras_anything/go.py", "ras_anything/scan.py", "ras_anything/harden.py", "ras_anything/verify.py", "ras_anything/enable.py", "ras_anything/bench.py", "ras_anything/report.py", "ras_anything/replay.py", "ras_anything/drift.py", "ras_anything/diagnose.py", "ras_anything/doctor.py", "ras_anything/export.py", "ras_anything/exporters", "ras_anything/lab.py", "ras_anything/slo.py", "ras_anything/ax.py", "ras_anything/judge.py", "ras_anything/runner.py"]
ignore_missing_imports = true
follow_imports = "silent"
