[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ras-anything"
version = "0.1.0"
description = "Don't rewrite it for reliability. Harden the 5% that breaks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "miles990"}]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
]

[project.scripts]
ras-anything = "ras_anything.cli:main"

[project.urls]
Homepage = "https://github.com/miles990/ras-anything"

[tool.setuptools]
packages = ["ras_anything", "ras_anything.lang", "ras_anything.patterns", "ras_anything.agents", "ras_anything.agents.python", "ras_anything.agents.python._inject"]

[tool.setuptools.package-data]
"ras_anything.agents.python" = ["_inject/*.py"]
"ras_anything.lang" = [
    "node_agent/*.cjs",
    "node_agent/patterns/*.cjs",
    "go_agent/asttool/*.go",
    "go_agent/rasagent/*.go",
    "go_agent/rasruntime/*.go",
    "java_agent/agent/*.java",
    "java_agent/tool/*.java",
    "java_agent/runtime/*.java",
]

# Lint gate (CI + `make lint`): pyflakes errors are bugs here (an undefined name shipped in doctor.status).
# Style rules (line length, %-formatting) are not enforced: the code base predates them (docs/REVIEW-PRACTICES.md).
[tool.ruff]
target-version = "py310"
line-length = 140
extend-exclude = ["examples", "build", "wow", "ras_anything/lang/node_agent", "ras_anything/lang/go_agent", "ras_anything/lang/java_agent"]

[tool.ruff.lint]
select = ["F", "E9", "B006", "B008", "B012", "B015", "B018"]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/*" = ["F401"]
"tests/test_install.py" = ["F841"]

[tool.mypy]
python_version = "3.10"
files = ["ras_anything/contracts.py", "ras_anything/lang/base.py", "ras_anything/lang/__init__.py", "ras_anything/patterns/__init__.py", "ras_anything/arch.py"]
ignore_missing_imports = true
follow_imports = "silent"
