# Proposed GitHub Actions workflow. Copy to .github/workflows/ci.yml (pushing workflow files needs a token with the
# `workflow` scope, or add it in the GitHub web UI). Kept here because the agent token cannot push workflows.
# CI for ras-anything (docs/REVIEW-PRACTICES.md §CI). Private repo: Linux runs on every push; macOS and
# Windows bill at 10x / 2x the minutes, so they run only when started by hand (Actions → ci → Run workflow).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      all_os:
        description: "also run macOS and Windows"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff mypy
      - run: ruff check .
      - run: mypy

  test:
    needs: lint
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'workflow_dispatch' && inputs.all_os) && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
      - run: python -m venv .venv && .venv/bin/python -m pip install -e . coverage || (python -m venv .venv && .venv/Scripts/python -m pip install -e . coverage)
      - name: tests with branch coverage
        run: |
          PY=.venv/bin/python; [ -x "$PY" ] || PY=.venv/Scripts/python
          $PY -m coverage run --branch --source=ras_anything -m unittest discover -s tests -t .
          $PY -m coverage report --skip-empty | tail -1
