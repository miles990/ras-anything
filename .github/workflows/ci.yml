# Proposed GitHub Actions workflow. Copy to .github/workflows/ci.yml (pushing workflow files needs a token with the
# `workflow` scope, or add it in the GitHub web UI). Kept here because the agent token cannot push workflows.
# CI for ras-anything (docs/REVIEW-PRACTICES.md §CI). Linux runs on every push; macOS and Windows bill at a
# higher rate, so they run only when started by hand (Actions → ci → Run workflow).
# Actions are pinned to a full commit SHA (OpenSSF Scorecard Pinned-Dependencies). Tags in comments are the
# matching release; bump the SHA when updating.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      all_os:
        description: "also run macOS and Windows"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install ruff mypy
      - run: ruff check .
      - run: mypy

  test:
    needs: lint
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'workflow_dispatch' && inputs.all_os) && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "22"
      - run: python -m venv .venv && .venv/bin/python -m pip install -e . coverage || (python -m venv .venv && .venv/Scripts/python -m pip install -e . coverage)
      - name: tests with branch coverage
        run: |
          PY=.venv/bin/python; [ -x "$PY" ] || PY=.venv/Scripts/python
          $PY -m coverage run --branch --source=ras_anything -m unittest discover -s tests -t .
          $PY -m coverage report --skip-empty | tail -1
